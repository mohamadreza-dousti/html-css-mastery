<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-Page</title>
    <link rel="icon" href="./favicon/D.ico" type="image/x-ico">
    <style>
        body {
            font-size: 18px;
            background-color: lightblue;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            width: 350px;
            margin: 20px auto;
        }

        fieldset{
            background-color: white;
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            margin: 0;
            border-radius: 8px;
            box-shadow: 0 0 10px #666;
        }

        legend {
            display: table; 
            position: relative;
            margin: auto;
            color: #000000;
            font-size: 15px;
            text-align: center;
            padding: 2px 4px;
        }

        #submit {
            width: 70%;
            height: 30px;
            border-radius: 6px;
            color: black;
            background-color: lightblue;
            margin-top: 20px;
        }

        #logo {
            width: 65%;
            height: 80px;
        }

        .input {
            width: 70%;
            height: 30px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .labels {
            display: block;
            text-align: right;
            padding-right: 45px;
            padding-bottom: 4px;
        }

    </style>
</head>
<body>
    <form action="" autocomplete="on" method="post">
        <fieldset>
            <img src="./favicon/Dousti.webp" alt="logo" id="logo">
            <div>
                <label for="name" class="labels">نام</label>
                <input type="text" name="name" placeholder="نام" class="input" id="name" autocomplete="name" autofocus required>
            </div>
            <div>
                <label for="email" class="labels">ایمیل</label>
                <input type="email" name="email" placeholder="ایمیل" class="input" id="email" autocomplete="email" required>
            </div>
            <div>
                <label for="password" class="labels">رمز عبور</label>
                <input type="password" name="password" minlength="8" maxlength="20" id="password" placeholder="رمز" class="input" autocomplete="new-password" required>
            </div>
            <div>
                <label for="confirm-password" class="labels">تکرار رمز عبور</label>
                <input type="password" name="confirm-password" minlength="8" maxlength="20" id="confirm-password" placeholder="تکرار رمز" class="input" autocomplete="new-password" required>
            </div>
            <div>
                <input type="checkbox" name="rules" id="rule"  required>
                <label for="rule">شرایط و قوانین سایت <a href="./rules.html">دوستی</a> را می‌پذیرم</label>
            </div>
            <div>
                <button type="submit" id="submit">ثبت نام</button>
            </div>
        </fieldset>
    </form>
</body>
</html>
