<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-Span</title>
    <link rel="icon" href="./favicon/D.ico" type="image/x-ico">
    <style>
        body{
            font-size: 28px;
        }
        div{
            padding: 10px;
        }
    </style>
</head>
<body>
    <div style="display: flex;">
        <div style="border: 2px solid black; background-color: aqua;width:  300px;">
            <h2>عنوان اول</h2>
            <p>متن <span style="color: red;">تستی</span> اول</p>
        </div>
        <div style="height: 200px; width: 200px;">
            <img src="https://img.magnific.com/free-vector/male-programmer-working-computer-office-wall-with-hanging-reminder-stickers-developer-creating-new-software-interface-coding-programming-system-administrator-designer-character_575670-1159.jpg?semt=ais_test_b&w=740&q=80" alt="developer image">
        </div>
    </div>
    <br>
    <div style="border: 2px solid black; background-color: aqua; width: 300px;">
        <h2>عنوان دوم</h2>
        <p>متن تستی دوم</p>
    </div>
</body>
</html>
