<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class-id-html</title>
    <link rel="icon" href="favicon/D.ico" type="image/x-ico">
    <style>
        body {
            font-size: 24px;
        }
        .title {
            width: 190px;
            text-align: center;
        }
        .text {
            border: 2px solid black;
            background-color: blue;
            color: lightblue;
        }
        #first-text-id{
            border: 2px solid black;
            background-color: gray;
            color: lightgray;
        }
    </style>
</head>
<body>
    <h1 class="text title">عنوان اول</h1>
    <h2>عنوان دوم</h2>
    <p class="text">متن تستی اول</p>
    <p id="first-text-id">متن تستی دوم</p>
    <p class="text">متن تستی سوم</p>
</body>
</html>
