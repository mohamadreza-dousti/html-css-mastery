<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon/D.ico" type="image/x-ico">
    <title>hmtl input attributes</title>
</head>
<body>
    <form action="" autocomplete="on">
        <div>
            <fieldset style="width: 350px;">
                <legend>HTMl Input Attributes</legend>

                <div>
                    <input type="text" value="mohamadreza-dousti" readonly>
                </div><br>
            
                <div>
                    <button type="button" disabled>Click Me</button>
                </div><br>

                <div>
                    <input type="text"  maxlength="5" placeholder="max 5" autofocus>
                </div><br>

                <div>
                    <input type="number" min="10" max="20" placeholder="num">
                </div><br>
            
                <div>
                    <input type="file" multiple>
                </div><br>

                <div>
                    <input type="text" placeholder="enter your name">
                </div><br>

                <div>
                    <input type="password" placeholder="password" required>
                </div><br>
            </fieldset>
        </div><br>
        <div><button type="submit">save</button></div>
    </form>
</body>
</html>
