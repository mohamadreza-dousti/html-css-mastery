<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon/D.ico" type="image/x-ico">
    <title>Input-Types</title>
    <style>
        body {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <form action="" autocomplete="on" method="get">
        <fieldset style="width: 250px;">
            <legend>HTML Input Types</legend>
            <div>
                <label>Color</label>
                <input type="color" value="#ADD8E6">
            </div>

            <div>
                <label>Date</label>
                <input type="date">
            </div>

            <div>
                <label>Email</label>
                <input type="email">
            </div>

            <div>
                <label>File</label>
                <input type="file">
            </div>
            
            <div>
                <label>Hidden</label>
                <input type="hidden" value="mohamadreza-dousti">
            </div>

            <div>
                <label>Number</label>
                <input type="number">
            </div>

            <div>
                <label>Password</label>
                <input type="password" required>
            </div>

            <div>
                <label>Range</label>
                <input type="range" min="0" max="100">
            </div>
        </fieldset>
        <button type="submit" value="save-data" id="save-btn">Submit</button>
    </form>
</body>
</html>
