<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Tag</title>
</head>
<body>
    <picture>
        <source media="(min-width: 1500px)" srcset="./images/developer.jpg" style="width: 400px;">
        <source media="(min-width: 1200px)" srcset="./images/dev.jpg" style="width: 400px;">
        <source media="(min-width: 750px)" srcset="./images/dev2.jpg" style="width: 400px;">
        <img src="./images/Developer.webp" alt="developer" style="width: 400px;">
    </picture>
</body>
</html>
